[project]
name = "llm-api-litellm"
version = "0.1.0"
description = "Project-isolated LiteLLM proxy and Admin UI"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm[proxy]==1.102.1",
    "prisma==0.15.0",
]

[tool.uv]
package = false

[tool.prisma]
binary_cache_dir = "../../var/cache/prisma/binaries"
home_dir = "../../var/cache/prisma"
nodeenv_cache_dir = "../../var/cache/prisma/nodeenv-24.19.0"
nodeenv_extra_args = ["--node=24.19.0"]
use_global_node = false
use_nodejs_bin = false
